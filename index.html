<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Remplacé au build par --base-href (ex. /tva-agility/ pour GitHub Pages). -->
  <base href="/tva-agility/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Planning des terrains, cours et parcours du club Toulouse Véto Agility.">
  <meta name="theme-color" content="#000000">

  <!-- iPhone / iPad : appli « ajoutée à l'écran d'accueil » -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TVA Agility">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>TVA Agility</title>

  <style>
    html, body { margin: 0; height: 100%; background: #FFF8F6; }
    #chargement {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #5C3F38;
    }
    #chargement img { width: 96px; height: 96px; border-radius: 22px; }
    #chargement .barre {
      width: 120px; height: 4px; border-radius: 2px; overflow: hidden;
      background: #F3DDD7;
    }
    #chargement .barre::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: #B5462E; border-radius: 2px;
      animation: va 1.1s ease-in-out infinite;
    }
    @keyframes va { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-color-scheme: dark) {
      html, body { background: #1A1110; }
      #chargement { color: #F1DFDA; }
      #chargement .barre { background: #3B2B28; }
    }
  </style>
</head>
<body>
  <div id="chargement">
    <img src="icons/Icon-192.png" alt="">
    <div>Toulouse Véto Agility</div>
    <div class="barre"></div>
  </div>
  <script>
    // L'écran de chargement disparaît dès que l'appli s'affiche.
    window.addEventListener('flutter-first-frame', function () {
      var e = document.getElementById('chargement');
      if (e) e.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
